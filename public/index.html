<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f6f4" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ardite">
  <title>Ardite</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash
    try {
      const t = JSON.parse(localStorage.getItem('ardite.settings') || '{}').theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <div class="layout">
    <header class="top">
      <a class="brand" href="/" data-i18n-attr="aria-label:home">
        <img src="/icon.svg" alt="" width="30" height="30">
        <span>ardite</span>
      </a>
      <div class="top-actions">
        <button id="phoneBtn" class="icon-btn" type="button" data-i18n-attr="title:phone.btn,aria-label:phone.btn" hidden>
          <svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M10.5 18h3"/></svg>
        </button>
        <button id="settingsBtn" class="icon-btn" type="button" data-i18n-attr="title:settings,aria-label:settings">
          <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        </button>
      </div>
    </header>

    <main class="main">
      <div id="updateBar" class="update-bar" role="status" hidden></div>

      <section class="hero">
        <h1><span data-i18n="hero.line1"></span><br><span class="accent" data-i18n="hero.line2"></span></h1>
        <p class="sub" data-i18n="hero.sub"></p>

        <form id="form" class="omnibox" autocomplete="off" novalidate>
          <svg class="omni-icon" viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3.2-3.2a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3.2 3.2a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>
          <input id="url" type="url" inputmode="url" enterkeyhint="go" spellcheck="false" autocapitalize="off"
                 data-i18n-attr="placeholder:input.placeholder,aria-label:input.label">
          <button id="clearBtn" class="icon-btn ghost" type="button" data-i18n-attr="aria-label:clear" hidden>
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
          <button id="pasteBtn" class="paste-btn" type="button" hidden>
            <svg viewBox="0 0 24 24"><rect x="7" y="4" width="10" height="4" rx="1.5"/><path d="M9 6H7a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-2"/></svg>
            <span data-i18n="paste"></span>
          </button>
          <button id="goBtn" class="go-btn" type="submit" data-i18n-attr="aria-label:download">
            <svg viewBox="0 0 24 24"><path d="M12 4v12M6.5 10.5 12 16l5.5-5.5M5 20h14"/></svg>
          </button>
        </form>

        <div class="controls">
          <div class="segmented" role="tablist" data-i18n-attr="aria-label:mode.label">
            <button type="button" role="tab" data-mode="video">
              <svg viewBox="0 0 24 24"><rect x="3" y="5" width="13" height="14" rx="2.5"/><path d="M16 10l5-3v10l-5-3"/></svg><span data-i18n="mode.video"></span>
            </button>
            <button type="button" role="tab" data-mode="audio">
              <svg viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg><span data-i18n="mode.audio"></span>
            </button>
          </div>
          <div id="opts" class="chips" data-i18n-attr="aria-label:opts.label"></div>
          <div id="trimBox" class="trim" hidden>
            <div class="trim-row">
              <label><span data-i18n="trim.start"></span>
                <input id="trimStart" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="0:00">
              </label>
              <span class="trim-dash">–</span>
              <label><span data-i18n="trim.end"></span>
                <input id="trimEnd" inputmode="decimal" autocomplete="off" spellcheck="false">
              </label>
            </div>
            <label class="trim-precise">
              <input id="trimPrecise" type="checkbox" class="check">
              <span data-i18n="trim.precise"></span>
            </label>
            <p class="hint" data-i18n="trim.hint"></p>
          </div>
          <p id="optsHint" class="hint" hidden></p>
        </div>
      </section>

      <section id="preview" class="card preview" hidden aria-live="polite"></section>

      <section id="jobs" class="jobs" aria-live="polite"></section>

      <section id="historySec" class="history" hidden>
        <div class="sec-head">
          <h2 data-i18n="history.title"></h2>
          <button id="clearHistory" class="link-btn" type="button" data-i18n="clear"></button>
        </div>
        <ul id="history"></ul>
      </section>
    </main>

    <aside id="phoneCard" class="card phone-card" hidden>
      <h2 data-i18n="phone.title"></h2>
      <p data-i18n-html="phone.card"></p>
      <div class="qr" data-qr></div>
      <code class="lan-url" data-lan></code>
      <p class="tiny" data-i18n="phone.tip"></p>
    </aside>

    <footer class="foot">
      <span id="footInfo" data-i18n="foot"></span>
    </footer>
  </div>

  <dialog id="settingsDlg" class="sheet">
    <form method="dialog" class="sheet-inner">
      <div class="sheet-head">
        <h2 data-i18n="settings"></h2>
        <button class="icon-btn ghost" value="close" data-i18n-attr="aria-label:close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>

      <fieldset>
        <legend data-i18n="set.format"></legend>
        <label class="radio-card">
          <input type="radio" name="codec" value="best">
          <span><b data-i18n="set.best"></b><small data-i18n="set.best.desc"></small></span>
        </label>
        <label class="radio-card">
          <input type="radio" name="codec" value="h264">
          <span><b data-i18n="set.h264"></b><small data-i18n="set.h264.desc"></small></span>
        </label>
        <p class="tiny" data-i18n="set.format.note"></p>
      </fieldset>

      <fieldset>
        <legend data-i18n="set.general"></legend>
        <label class="switch-row">
          <span><b data-i18n="set.autoSave"></b><small data-i18n="set.autoSave.desc"></small></span>
          <input type="checkbox" name="autoSave" class="switch">
        </label>
        <div class="row">
          <span><b data-i18n="set.theme"></b></span>
          <div class="mini-seg">
            <button type="button" data-theme-val="auto" data-i18n="auto"></button>
            <button type="button" data-theme-val="light" data-i18n="theme.light"></button>
            <button type="button" data-theme-val="dark" data-i18n="theme.dark"></button>
          </div>
        </div>
        <div class="row">
          <span><b data-i18n="set.lang"></b></span>
          <div class="mini-seg">
            <button type="button" data-lang-val="auto" data-i18n="auto"></button>
            <button type="button" data-lang-val="en">English</button>
            <button type="button" data-lang-val="tr">Türkçe</button>
          </div>
        </div>
      </fieldset>

      <p class="tiny" id="aboutLine"></p>
    </form>
  </dialog>

  <dialog id="phoneDlg" class="sheet">
    <form method="dialog" class="sheet-inner center">
      <div class="sheet-head">
        <h2 data-i18n="phone.title"></h2>
        <button class="icon-btn ghost" value="close" data-i18n-attr="aria-label:close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <p data-i18n-html="phone.dlg"></p>
      <div class="qr" data-qr></div>
      <code class="lan-url" data-lan></code>
      <p class="tiny" data-i18n="phone.note"></p>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script src="/vendor/qrcode.js" defer></script>
  <script src="/i18n.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
